<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Table — Bella Cucina Backoffice</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body style="background:#f4f5f7;">

<nav class="navbar has-shadow" style="background:#fff;">
  <div class="navbar-brand">
    <span class="navbar-item" style="font-weight:700;font-size:1.15rem;">Bella Cucina <span style="color:#8a8a8a;font-weight:400;margin-left:.45rem;">Backoffice</span></span>
  </div>
  <div class="navbar-menu is-active" style="box-shadow:none;">
    <div class="navbar-start">
      <a class="navbar-item" style="border-bottom:3px solid #3b82f6;font-weight:600;color:#3b82f6;">Tables</a>
      <a class="navbar-item">Menu</a>
      <a class="navbar-item">Closures</a>
    </div>
  </div>
</nav>

<section class="section">
<div class="container" style="max-width:620px;">

  <nav class="breadcrumb is-small" style="margin-bottom:1rem;">
    <ul><li><a>Table Configuration</a></li><li class="is-active"><a>Add table</a></li></ul>
  </nav>

  <div class="box" style="padding:2rem;">
    <h1 class="title is-4">Add table</h1>
    <p class="has-text-grey" style="margin-bottom:1.75rem;">The table is created as a draft and becomes visible to guests once the configuration is published.</p>

    <div class="field">
      <label class="label">Table name</label>
      <div class="control"><input class="input" type="text" value="Terrace 4"></div>
      <p class="help">Shown to staff in the floor plan and on reservation lists.</p>
    </div>

    <div class="field">
      <label class="label">Seats</label>
      <div class="control" style="max-width:140px;"><input class="input" type="number" value="4"></div>
      <p class="help">Must be between 1 and 20.</p>
    </div>

    <div class="field">
      <label class="label">Location</label>
      <div class="control">
        <div class="select is-fullwidth">
          <select><option>Terrace</option><option>Indoor</option><option>Bar</option><option>Private room</option></select>
        </div>
      </div>
    </div>

    <div class="field" style="margin-top:2rem;">
      <div class="control" style="display:flex;gap:.75rem;">
        <a class="button is-primary">Add table</a>
        <a class="button is-light">Cancel</a>
      </div>
    </div>
  </div>

</div>
</section>
</body>
</html>
